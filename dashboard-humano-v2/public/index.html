<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Humano - Demo</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/main.css?v=3">
  <link rel="stylesheet" href="/css/chat-list.css?v=3">
  <link rel="stylesheet" href="/css/conversation.css?v=3">
  <link rel="stylesheet" href="/css/config.css?v=2">
  <link rel="stylesheet" href="/css/stats.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div id="testingBanner" class="testing-banner" style="display:none;">
        ⚠️ ENTORNO DE TESTING — Los datos NO son reales
      </div>
      <div class="header-left">
        <button id="sidebarToggle" class="hamburger-btn" aria-label="Menú">☰</button>
        <h1>Demo - WhatsApp Automation</h1>
        <span id="demoBadge" class="demo-badge" style="display:none;">DEMO</span>
      </div>
      <div class="header-right">
        <button id="resetDemoBtn" class="btn-reset-demo" style="display:none;">🔄 Reset Demo</button>
        <span id="userName">Usuario</span>
        <button id="logoutBtn" class="btn-logout">Salir</button>
      </div>
    </header>
    
    <div class="main-container">
      <aside class="chat-list">
        <div class="chat-list-header">
          <div class="tabs">
            <button id="tabChats" class="tab active" aria-label="Ver Chats">📱 Chats (<span id="chatCount">0</span>)</button>
            <button id="tabConfig" class="tab" aria-label="Configuración">⚙️ Config</button>
            <button id="tabStats" class="tab" aria-label="Estadísticas">📊 Stats</button>
          </div>
          <input type="text" id="searchInput" placeholder="🔍 Buscar...">
        </div>
        <div id="chatListContainer" class="chat-list-items">
          <p class="no-chats">No hay chats activos</p>
        </div>
        <div id="configContainer" class="config-container" style="display: none;">
          <p class="no-chats">Cargando configuración...</p>
        </div>
        <div id="statsContainer" class="stats-container" style="display: none;">
          <div class="stats-controls">
            <label>Desde <input type="date" id="statsDateFrom"></label>
            <label>Hasta <input type="date" id="statsDateTo"></label>
            <button id="statsDateApply" class="btn-apply-date">Consultar</button>
          </div>
          <p class="no-chats">Cargando estadísticas...</p>
        </div>
      </aside>
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
      
      <main class="conversation-area">
        <div class="no-chat-selected">
          <p>Selecciona un chat para comenzar</p>
        </div>
        <div id="conversationContainer" class="conversation-container" style="display: none;">
          <div class="conversation-header">
            <h3 id="chatName">Cliente</h3>
            <div class="conversation-header-actions">
              <span id="chatStatus" class="status-badge bot">Bot activo</span>
              <button id="takeBtn" class="btn-handoff" aria-label="Tomar conversación">Tomar conversación</button>
              <button id="resumeBtn" class="btn-resume" aria-label="Devolver conversación al bot">Devolver al bot</button>
            </div>
          </div>
          <div id="messagesContainer" class="messages-container"></div>
          <div class="input-container">
            <textarea id="messageInput" placeholder="Escribe tu mensaje..." rows="1"></textarea>
            <button id="sendBtn" class="btn-send" aria-label="Enviar mensaje">Enviar</button>
            <button id="finishBtn" class="btn-finish" aria-label="Finalizar conversación">✅ MUCHAS GRACIAS</button>
          </div>
        </div>
        <div id="configPanel" class="config-panel" style="display: none;">
          <div class="config-header">
            <h2>⚙️ Administración de Números</h2>
            <p class="config-subtitle">Gestiona los números admin e ignorados del bot</p>
          </div>
          <div id="adminNumbersList" class="admin-numbers-list"></div>
          <button id="addNumberBtn" class="btn-add-number">➕ Agregar Número</button>
        </div>
        <div id="statsPanel" class="stats-panel" style="display: none;"></div>
      </main>
    </div>
  </div>
  
  <audio id="notificationSound" src="/assets/sounds/notification.wav" preload="auto"></audio>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat-list.js"></script>
  <script src="/js/conversation.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
